# Creates the Google Cloud lab, runs the fault scenarios, saves the results
# and tears everything down. Starts only by hand, and only with the
# confirmation phrase, because it creates billable resources.
name: lab-gcp

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "create billable resources" to run'
        required: true
      ttl:
        description: Lease length
        default: 5s

permissions:
  contents: read
  id-token: write

concurrency:
  group: lab-gcp
  cancel-in-progress: false

jobs:
  lab:
    if: inputs.confirm == 'create billable resources'
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      # Set these three as repository variables; deploy/lab-gcp/setup.sh prints them.
      RAW_PROJECT: ${{ vars.GCP_PROJECT }}
      RAW_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      RAW_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      TF_IN_AUTOMATION: "true"
      DUET_TTL: ${{ inputs.ttl }}
    defaults:
      run:
        working-directory: deploy/lab-gcp
    steps:
      - uses: actions/checkout@v4

      # A variable pasted with a trailing newline breaks every API URL built
      # from it, so strip whitespace before anything uses the values.
      - name: Normalise identifiers
        working-directory: .
        run: |
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          {
            echo "TF_VAR_project=$(clean "$RAW_PROJECT")"
            echo "GCP_SERVICE_ACCOUNT=$(clean "$RAW_SERVICE_ACCOUNT")"
            echo "GCP_WIF_PROVIDER=$(clean "$RAW_WIF_PROVIDER")"
          } >> "$GITHUB_ENV"
          test -n "$(clean "$RAW_PROJECT")" || { echo "::error::repository variable GCP_PROJECT is not set"; exit 1; }

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o duet ../../cmd/duet

      - name: Fetch etcd for the control
        run: |
          V=v3.7.4
          curl -fsSL -o etcd.tgz "https://github.com/etcd-io/etcd/releases/download/$V/etcd-$V-linux-amd64.tar.gz"
          curl -fsSL -o SHA256SUMS "https://github.com/etcd-io/etcd/releases/download/$V/SHA256SUMS"
          grep "etcd-$V-linux-amd64.tar.gz" SHA256SUMS | sed "s#etcd-$V-linux-amd64.tar.gz#etcd.tgz#" | sha256sum -c -
          tar xzf etcd.tgz --strip-components=1 "etcd-$V-linux-amd64/etcd" "etcd-$V-linux-amd64/etcdctl"

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.TF_VAR_project }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Create lab
        run: terraform init -input=false && terraform apply -input=false -auto-approve

      - name: Run scenarios
        run: ./run.sh

      - name: Node logs
        if: failure()
        run: tail -n 60 node-*.log || true

      - name: Summary
        if: always()
        run: test -f summary.md && cat summary.md >> "$GITHUB_STEP_SUMMARY" || echo "no summary produced" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-gcp-results
          path: |
            deploy/lab-gcp/results.json
            deploy/lab-gcp/summary.md
            deploy/lab-gcp/node-*.log
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: terraform destroy -input=false -auto-approve

      - name: Check nothing is left
        if: always()
        run: |
          left="$(gcloud compute instances list --project "$TF_VAR_project" --filter='labels.lab=duet-lab' --format='value(name)')"
          disks="$(gcloud compute disks list --project "$TF_VAR_project" --filter='labels.lab=duet-lab' --format='value(name)')"
          if [ -n "$left$disks" ]; then
            echo "::error::lab resources still exist: $left $disks"
            exit 1
          fi
